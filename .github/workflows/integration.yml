name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    name: DB Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Cache Supabase Docker images
        id: cache-supabase
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-docker
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Docker images
        if: steps.cache-supabase.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-docker/images.tar

      - name: Start Supabase
        run: supabase start

      - name: Save Docker images for future runs
        if: steps.cache-supabase.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/supabase-docker
          docker save $(docker images --filter=reference='supabase/*' --format '{{.Repository}}:{{.Tag}}') -o /tmp/supabase-docker/images.tar

      - name: Apply migrations
        run: supabase db reset

      - name: Export Supabase env vars
        run: |
          echo "SUPABASE_TEST_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          SERVICE_KEY=$(supabase status --output env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"/\1/p')
          echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: bun run test:integration
